<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penguin Tetris</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #0a1a2f 0%, #1a3a5c 50%, #0d2840 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #e0f0ff;
    }
    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #0088ff;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }
    .game-container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }
    .board-wrapper {
      position: relative;
    }
    #board {
      border: 4px solid #00ffff;
      border-radius: 8px;
      box-shadow: 
        0 0 20px #00ffff,
        inset 0 0 20px rgba(0, 255, 255, 0.1),
        0 0 40px rgba(0, 136, 255, 0.3);
      background: #051020;
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 160px;
    }
    .panel-box {
      background: rgba(0, 50, 100, 0.8);
      border: 2px solid #0088ff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(0, 136, 255, 0.2);
    }
    .panel-title {
      font-size: 0.9rem;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 0 5px #00ffff;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 10px #00ffff;
      font-family: 'Courier New', monospace;
    }
    #nextCanvas {
      display: block;
      margin: 0 auto;
      border: 2px solid #0088ff;
      border-radius: 4px;
      background: #051020;
    }
    .controls {
      font-size: 0.7rem;
      color: #88ccff;
      line-height: 1.8;
      text-align: center;
    }
    .controls kbd {
      background: rgba(0, 100, 200, 0.5);
      border: 1px solid #0088ff;
      border-radius: 3px;
      padding: 2px 6px;
      color: #00ffff;
      font-family: inherit;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: bold;
      color: #ff4444;
      text-shadow: 0 0 20px #ff4444, 0 0 40px #ff0000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      text-align: center;
      white-space: nowrap;
      z-index: 10;
    }
    #message.show { opacity: 1; }
    #message.game-over { color: #ff4444; text-shadow: 0 0 20px #ff4444; }
    #message.paused { color: #ffff00; text-shadow: 0 0 20px #ffff00; }
    .penguin-decor {
      position: fixed;
      bottom: 20px;
      font-size: 3rem;
      animation: waddle 2s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
    }
    .penguin-left { left: 20px; animation-delay: 0s; }
    .penguin-right { right: 20px; animation-delay: 1s; }
    @keyframes waddle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @media (max-width: 700px) {
      .game-container { flex-direction: column; align-items: center; }
      .side-panel { flex-direction: row; width: 100%; max-width: 320px; }
      .penguin-decor { display: none; }
    }
  </style>
</head>
<body>
  <h1>🐧 PENGUIN TETRIS 🐧</h1>
  <div class="game-container">
    <div class="board-wrapper">
      <canvas id="board" width="240" height="480"></canvas>
      <div id="message"></div>
    </div>
    <div class="side-panel">
      <div class="panel-box">
        <div class="panel-title">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-title">Lines</div>
        <div class="stat-value" id="lines">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-title">Level</div>
        <div class="stat-value" id="level">1</div>
      </div>
      <div class="panel-box">
        <div class="panel-title">Next</div>
        <canvas id="nextCanvas" width="80" height="80"></canvas>
      </div>
      <div class="panel-box controls">
        <kbd>←</kbd><kbd>→</kbd> Move &nbsp; <kbd>↑</kbd> Rotate<br>
        <kbd>↓</kbd> Soft Drop &nbsp; <kbd>Space</kbd> Hard Drop<br>
        <kbd>P</kbd> Pause &nbsp; <kbd>R</kbd> Restart
      </div>
    </div>
  </div>
  <div class="penguin-decor penguin-left">🐧</div>
  <div class="penguin-decor penguin-right">🐧</div>

  <script>
    const COLS = 10, ROWS = 20, BLOCK_SIZE = 24;
    const COLORS = [
      null,
      '#00ffff', // I - cyan
      '#ffcc00', // O - yellow
      '#ff6600', // L - orange
      '#0066ff', // J - blue
      '#00ff66', // S - green
      '#ff0066', // Z - pink
      '#cc66ff'  // T - purple
    ];
    const GHOST_ALPHA = 0.3;

    const SHAPES = [
      [],
      [[1,1,1,1]],           // I
      [[1,1],[1,1]],         // O
      [[1,0,0],[1,1,1]],     // L
      [[0,0,1],[1,1,1]],     // J
      [[0,1,1],[1,1,0]],     // S
      [[1,1,0],[0,1,1]],     // Z
      [[0,1,0],[1,1,1]]      // T
    ];

    const KICKS = {
      JLSTZ: [
        [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
        [[0,0],[1,0],[1,-1],[0,2],[1,2]],
        [[0,0],[1,0],[1,-1],[0,2],[1,2]],
        [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]]
      ],
      I: [
        [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
        [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
        [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
        [[0,0],[-2,0],[1,0],[-2,-1],[1,2]]
      ]
    };

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const messageEl = document.getElementById('message');

    let board, current, nextPiece, score, lines, level, dropInterval, lastTime, gameOver, paused, bag;

    function reset() {
      board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
      score = 0; lines = 0; level = 1; dropInterval = 1000; lastTime = 0;
      gameOver = false; paused = false;
      bag = []; current = null; nextPiece = null;
      refillBag(); refillBag();
      spawnPiece(); spawnNext();
      updateUI(); hideMessage();
      requestAnimationFrame(gameLoop);
    }

    function refillBag() {
      const pieces = [1,2,3,4,5,6,7];
      for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }
      bag.push(...pieces);
    }

    function spawnPiece() {
      if (bag.length === 0) refillBag();
      const type = bag.shift();
      current = {
        type, matrix: SHAPES[type], x: Math.floor(COLS/2) - 1, y: 0, rotation: 0
      };
      if (collides(current)) gameOver = true;
    }

    function spawnNext() {
      if (bag.length === 0) refillBag();
      nextPiece = { type: bag[0], matrix: SHAPES[bag[0]] };
    }

    function collides(piece, dx=0, dy=0, matrix=null) {
      const m = matrix || piece.matrix;
      for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {
          if (m[y][x]) {
            const nx = piece.x + x + dx;
            const ny = piece.y + y + dy;
            if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && board[ny][nx])) return true;
          }
        }
      }
      return false;
    }

    function rotate(matrix) {
      const N = matrix.length;
      const result = Array(N).fill().map(() => Array(N).fill(0));
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) result[x][N-1-y] = matrix[y][x];
      return result;
    }

    function tryRotate(dir) {
      const newMatrix = rotate(current.matrix);
      const kicks = current.type === 1 ? KICKS.I : KICKS.JLSTZ;
      const kickSet = kicks[(current.rotation + (dir===1?1:3)) % 4];
      for (const [kx, ky] of kickSet) {
        if (!collides(current, kx, ky, newMatrix)) {
          current.matrix = newMatrix;
          current.x += kx;
          current.y += ky;
          current.rotation = (current.rotation + (dir===1?1:3)) % 4;
          return true;
        }
      }
      return false;
    }

    function hardDrop() {
      let drop = 0;
      while (!collides(current, 0, drop + 1)) drop++;
      current.y += drop;
      score += drop * 2;
      lockPiece();
    }

    function lockPiece() {
      current.matrix.forEach((row, y) => row.forEach((v, x) => {
        if (v && current.y + y >= 0) board[current.y + y][current.x + x] = current.type;
      }));
      clearLines();
      spawnPiece(); spawnNext();
    }

    function clearLines() {
      let cleared = 0;
      outer: for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) if (!board[y][x]) continue outer;
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));
        cleared++; y++;
      }
      if (cleared) {
        const points = [0, 100, 300, 500, 800];
        score += points[cleared] * level;
        lines += cleared;
        const newLevel = Math.floor(lines / 10) + 1;
        if (newLevel > level) { level = newLevel; dropInterval = Math.max(100, 1000 - (level-1)*80); }
        updateUI();
      }
    }

    function updateUI() {
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
    }

    function showMessage(text, className) {
      messageEl.textContent = text;
      messageEl.className = className ? `show ${className}` : 'show';
    }
    function hideMessage() { messageEl.className = ''; }

    function drawBlock(ctx, x, y, color, ghost=false, size=BLOCK_SIZE) {
      const px = x * size, py = y * size;
      ctx.save();
      if (ghost) ctx.globalAlpha = GHOST_ALPHA;
      const grad = ctx.createLinearGradient(px, py, px+size, py+size);
      grad.addColorStop(0, lighten(color, 40));
      grad.addColorStop(1, darken(color, 30));
      ctx.fillStyle = grad;
      roundRect(ctx, px+1, py+1, size-2, size-2, 3);
      ctx.fill();
      ctx.strokeStyle = ghost ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath();
    }

    function lighten(hex, p) {
      const n = parseInt(hex.slice(1),16), r=(n>>16)+p, g=((n>>8)&255)+p, b=(n&255)+p;
      return '#' + ((Math.min(255,r)<<16)|(Math.min(255,g)<<8)|Math.min(255,b)).toString(16).padStart(6,'0');
    }
    function darken(hex, p) {
      const n = parseInt(hex.slice(1),16), r=(n>>16)-p, g=((n>>8)&255)-p, b=(n&255)-p;
      return '#' + ((Math.max(0,r)<<16)|(Math.max(0,g)<<8)|Math.max(0,b)).toString(16).padStart(6,'0');
    }

    function drawBoard() {
      ctx.fillStyle = '#051020';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(0,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*BLOCK_SIZE,0); ctx.lineTo(x*BLOCK_SIZE,canvas.height); ctx.stroke(); }
      for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*BLOCK_SIZE); ctx.lineTo(canvas.width,y*BLOCK_SIZE); ctx.stroke(); }
      board.forEach((row, y) => row.forEach((v, x) => { if (v) drawBlock(ctx, x, y, COLORS[v]); }));
    }

    function drawGhost() {
      let gy = current.y;
      while (!collides(current, 0, gy - current.y + 1)) gy++;
      if (gy > current.y) current.matrix.forEach((row, y) => row.forEach((v, x) => { if (v) drawBlock(ctx, current.x+x, gy+y, COLORS[current.type], true); }));
    }

    function drawCurrent() {
      current.matrix.forEach((row, y) => row.forEach((v, x) => { if (v) drawBlock(ctx, current.x+x, current.y+y, COLORS[current.type]); }));
    }

    function drawNext() {
      nextCtx.fillStyle = '#051020';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      const m = nextPiece.matrix;
      const offsetX = (nextCanvas.width - m[0].length * 20) / 2;
      const offsetY = (nextCanvas.height - m.length * 20) / 2;
      m.forEach((row, y) => row.forEach((v, x) => {
        if (v) {
          const px = offsetX + x * 20, py = offsetY + y * 20;
          nextCtx.fillStyle = COLORS[nextPiece.type];
          nextCtx.fillRect(px, py, 18, 18);
          nextCtx.strokeStyle = 'rgba(255,255,255,0.3)';
          nextCtx.strokeRect(px, py, 18, 18);
        }
      }));
    }

    function gameLoop(time) {
      if (gameOver) { showMessage('GAME OVER\nPress R to restart', 'game-over'); return; }
      if (paused) { showMessage('PAUSED\nPress P to resume', 'paused'); requestAnimationFrame(gameLoop); return; }
      const dt = time - lastTime;
      if (dt > dropInterval) { if (!moveDown()) lockPiece(); lastTime = time; }
      drawBoard(); drawGhost(); drawCurrent(); drawNext();
      requestAnimationFrame(gameLoop);
    }

    function moveDown() { if (!collides(current, 0, 1)) { current.y++; return true; } return false; }
    function move(dx) { if (!collides(current, dx, 0)) current.x += dx; }

    document.addEventListener('keydown', e => {
      if (gameOver && e.key !== 'r' && e.key !== 'R') return;
      switch(e.key) {
        case 'ArrowLeft': move(-1); break;
        case 'ArrowRight': move(1); break;
        case 'ArrowDown': if (moveDown()) score += 1; break;
        case 'ArrowUp': tryRotate(1); break;
        case ' ': e.preventDefault(); hardDrop(); break;
        case 'p': case 'P': paused = !paused; break;
        case 'r': case 'R': reset(); break;
      }
      updateUI();
    });

    reset();
  </script>
</body>
</html>
