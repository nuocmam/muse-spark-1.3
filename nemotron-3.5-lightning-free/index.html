<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #e0f7fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #264653;
  }
  h1 { margin-bottom: 10px; }
  .score { font-size: 1.2rem; margin-bottom: 10px; }
  canvas { border: 4px solid #1d3557; background: #a8e6cf; }
  #msg { margin-top: 20px; font-size: 1.1rem; color: #e76f51; }
</style>
</head>
<body>
  <h1>Penguin Tetris</h1>
  <div class="score">Score: <span id="score">0</span></div>
  <canvas id="canvas" width="300" height="600"></canvas>
  <div id="msg"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const msgEl = document.getElementById('msg');

    const BLOCK = 20;
    const COLS = 12;
    const ROWS = 20;
    const matrix = [];
    for (let i = 0; i < COLS; i++) matrix[i] = [];

    let score = 0;
    let gameOver = false;
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    const pieces = [
      [ [1,5,9,13], [4,5,6,7] ],
      [ [4,5,9,10], [2,6,5,9] ],
      [ [5,7,9,11], [1,2,5,9] ],
      [ [3,7,8,12], [4,5,6,7] ],
      [ [2,6,10,14], [4,5,9,13] ],
      [ [3,7,11,15], [4,8,12,13] ],
      [ [1,2,5,9] ]
    ];

    function createPiece(type) {
      return {
        type,
        matrix: pieces[type][0],
        x: 3,
        y: 0
      };
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < matrix[y].length; ++x) {
          matrix[x][matrix.length - 1 - y] = matrix[y][x];
        }
      }
      return matrix;
    }

    function collision(piece, board, dirX, dirY) {
      const m = piece.matrix;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x]) {
            const newX = piece.x + x + dirX;
            const newY = piece.y + y + dirY;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && board[newX] && board[newX][newY]) return true;
          }
        }
      }
      return false;
    }

    function merge(piece) {
      const m = piece.matrix;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x]) {
            const boardX = piece.x + x;
            const boardY = piece.y + y;
            if (boardY >= 0) board[boardX][boardY] = piece.type + 1;
          }
        }
      }
    }

    function clearLines(board) {
      let lines = 0;
 outer: for (let y = ROWS - 1; y >= 0; --y) {
        for (let x = 1; x < COLS - 1; ++x) {
          if (board[x][y] === 0) continue outer;
        }
        lines++;
        for (let x = 1; x < COLS - 1; ++x) {
          board[x][y] = 0;
        }
        y++;
      }
      return lines;
    }

    function pieceScore(lines) {
      const scores = [0, 100, 300, 500, 800];
      return scores[lines] * (level + 1);
    }

    let level = 1;

    function updateScore(lines) {
      score += pieceScore(lines);
      scoreEl.innerText = score;
      if (lines >= 10) level = Math.min(10, level + 1);
      dropInterval = 1000 - (level - 1) * 100;
    }

    let board = [];
    function createBoard() {
      for (let i = 0; i < COLS; i++) {
        board[i] = [];
        for (let j = 0; j < ROWS; j++) board[i][j] = 0;
      }
    }

    let piece = createPiece(0);
    function createPiecePiece() {
      piece = createPiece(Math.floor(Math.random() * pieces.length));
      if (collision(piece, board, 0, 0)) {
        gameOver = true;
        msgEl.innerText = 'Game Over';
      }
    }

    function control(e) {
      if (e.keyCode === 37) {
        if (!collision(piece, board, -1, 0)) piece.x--;
      } else if (e.keyCode === 39) {
        if (!collision(piece, board, 1, 0)) piece.x++;
      } else if (e.keyCode === 40) {
        dropInterval = 1;
      } else if (e.keyCode === 38) {
        const rotated = rotate(piece.matrix.slice(), 1);
        const kick = 0;
        if (!collision({matrix: rotated, x: piece.x, y: piece.y}, board, 0, 0)) {
          piece.matrix = rotated;
        }
      }
    }

    document.addEventListener('keydown', control);

    function mergePiece() {
      merge(piece);
      const lines = clearLines(board);
      if (lines > 0) updateScore(lines), clearLines(board);
      createPiecePiece();
    }

    function drop(time) {
      if ((lastTime = +time) - dropCounter > dropInterval) {
        if (!collision(piece, board, 0, 1)) piece.y++;
        else mergePiece();
        dropCounter = 0;
      }
      dropCounter += time - lastTime;
    }

    function loop(time) {
      drop(time);
      draw();
      lastTime = +time;
      requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#e0f7fa';
      ctx.fillRect(0, 0, COLS * BLOCK, ROWS * BLOCK);

      // draw board
      for (let x = 0; x < COLS; ++x) {
        for (let y = 0; y < ROWS; ++y) {
          if (board[x][y]) {
            ctx.fillStyle = '#1d3557';
            ctx.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, BLOCK - 2);
          }
        }
      }

      // draw piece
      const m = piece.matrix;
      ctx.fillStyle = '#ffd166';
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x]) {
            ctx.fillRect((piece.x + x) * BLOCK + 1, (piece.y + y) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
          }
        }
      }
    }

    function init() {
      createBoard();
      createPiecePiece();
      dropCounter = 0;
      lastTime = 0;
      score = 0;
      level = 1;
      scoreEl.innerText = '0';
      gameOver = false;
      msgEl.innerText = '';
      board = [];
      createBoard();
      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
